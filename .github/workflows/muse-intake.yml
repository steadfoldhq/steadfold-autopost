# Checks every new Muse delivery in incoming/muse/ and prepares it for the Social studio.
# Never schedules or posts anything (see docs/muse-handoff.md).
name: Muse intake

on:
  push:
    branches: [main]
    paths: ['incoming/muse/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: muse-intake
  cancel-in-progress: false

jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: python3 tools/intake_muse.py
      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add incoming/muse media/muse 2>/dev/null || true
          git commit -m "Muse intake: check new deliveries" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
