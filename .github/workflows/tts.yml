# Manual: ElevenLabs voiceover (with timings) for short-form pilots into the repo.
name: Eleven TTS
on:
  workflow_dispatch:
    inputs:
      spec: {description: 'Path to a TTS spec JSON in the repo', required: true, default: 'tools/tts-spec-shortform.json'}
permissions:
  contents: write
concurrency: {group: tts, cancel-in-progress: false}
jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          SPEC: ${{ inputs.spec }}
        run: |
          python3 tools/eleventts.py "$SPEC"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/voice && git commit -m "tts: voice from $SPEC" && git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"
