# Manual: render soft real-instrument music beds (FluidSynth + GM soundfont) into media/music/library/.
name: Instrument beds
on:
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: {group: music, cancel-in-progress: false}
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          sudo apt-get update -q
          sudo apt-get install -y -q fluidsynth fluid-soundfont-gm ffmpeg
          pip install -q mido
          python3 tools/instrument_beds.py /tmp/beds
          mkdir -p media/music/library
          for m in /tmp/beds/*.mid; do
            n=$(basename "$m" .mid); secs=$(cat /tmp/beds/$n.secs)
            fluidsynth -ni -g 0.6 -R 1 -C 1 -r 44100 -F /tmp/beds/$n.wav /usr/share/sounds/sf2/FluidR3_GM.sf2 "$m"
            ffmpeg -y -loglevel error -i /tmp/beds/$n.wav -t "$secs" \
              -af "highpass=f=40,lowpass=f=9000,afade=t=in:d=0.15,afade=t=out:st=$(python3 -c "print($secs-1.2)"):d=1.2,loudnorm=I=-16:TP=-2:LRA=9" \
              -ar 44100 -b:a 192k media/music/library/$n.mp3
          done
          ls -la media/music/library
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/music/library && git commit -m "music: render instrument beds" && git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"
