# Collects views, reach, saves, shares, likes and comment text for every account
# into insights/latest.json (+ a daily line in insights/history.jsonl), so the
# studios can learn what works. Reads only; never posts. Tokens are never printed.
name: Insights

on:
  schedule:
    - cron: '7 4,12,16,20 * * *'   # 4 times a day (UTC): ~12 am, 8 am, 12 pm, 4 pm Toronto
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: insights
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect insights
        env:
          IG_TOKEN_FULLYFUNDED: ${{ secrets.IG_TOKEN_FULLYFUNDED }}
          IG_TOKEN_LOCKEDHOUR: ${{ secrets.IG_TOKEN_LOCKEDHOUR }}
          IG_TOKEN_HOURBACK: ${{ secrets.IG_TOKEN_HOURBACK }}
          IG_TOKEN_LITTLEFOLD: ${{ secrets.IG_TOKEN_LITTLEFOLD }}
          IG_USERNAME_LITTLEFOLD: ${{ vars.IG_USERNAME_LITTLEFOLD }}
          IG_API_VERSION: ${{ vars.IG_API_VERSION }}
        run: python insights.py
      - name: Save insights
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add insights/
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -m "insights: update"
          for attempt in 1 2 3; do
            if git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            sleep $((attempt * 5))
          done
          exit 1
