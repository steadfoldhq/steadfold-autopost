# Manual: compose + render + master the v2 music library (14 beds, 3 stingers)
# into media/music/library/v2/. Real-instrument samples: FluidSynth + FluidR3_GM (MIT).
name: Music library v2
on:
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: {group: music, cancel-in-progress: false}
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          sudo apt-get update -q
          sudo apt-get install -y -q fluidsynth fluid-soundfont-gm ffmpeg
          pip install -q numpy
          python3 tools/music_v2.py /tmp/raw
          for m in /tmp/raw/*.mid; do
            n=$(basename "$m" .mid)
            fluidsynth -ni -q -g 0.45 -R 1 -C 1 -r 44100 -F /tmp/raw/$n.wav /usr/share/sounds/sf2/FluidR3_GM.sf2 "$m"
            ffmpeg -hide_banner -nostats -i /tmp/raw/$n.wav -af volumedetect -f null - 2>&1 | grep max_volume | sed "s/^/$n raw /"
          done
          python3 tools/music_post.py /tmp/raw media/music/library/v2
          ls -la media/music/library/v2
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/music/library/v2 && git commit -m "music: render library v2" && git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"
